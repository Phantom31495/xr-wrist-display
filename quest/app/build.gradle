apply plugin: 'com.android.application'

android {
    namespace 'com.zachery.xrwrist.quest'
    compileSdk 35

    // Set after NDK install; AGP falls back to default if unset.
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.zachery.xrwrist.quest"
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName "0.5.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // Proper release key (generated 2026-10-06, RSA-2048, 25y).
            // Passwords via env vars; falls back to project keystore.
            storeFile file(System.getenv("XRWRIST_KS") ?: "../xrwrist-release.keystore")
            storePassword System.getenv("XRWRIST_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("XRWRIST_KEY_ALIAS") ?: "xrwrist"
            keyPassword System.getenv("XRWRIST_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1+"
        }
    }

    // Keep the OpenXR loader .so uncompressed is unnecessary; default is fine.
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    // Lint's release check needs artifacts not available offline; skip it.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Khronos OpenXR loader for Android (provides libopenxr_loader.so, dlopen'd at runtime)
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
